<svg width="1400" height="1100" viewBox="0 0 1400 1100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3657C7"/>
    </marker>
    <style>
      .title { font: 700 34px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #1D2850; }
      .subtitle { font: 500 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #66759A; }
      .h { font: 700 22px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #1F2C4D; }
      .b { font: 500 17px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #31415F; }
      .small { font: 500 15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #62718F; }
      .tiny { font: 500 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #62718F; }
    </style>
  </defs>
  <rect width="1400" height="1100" rx="28" fill="#F8FAFF"/>
  <text x="80" y="90" class="title">MCP 协议与 VM Service 调用链路</text>
  <text x="80" y="125" class="subtitle">AI 发起工具调用 → MCP 翻译 → VM Service 传递 → Flutter App 执行</text>

  <!-- Layer 1: AI Agent -->
  <rect x="580" y="180" width="240" height="140" rx="24" fill="#FFFFFF" stroke="#8EA3FF" stroke-width="3"/>
  <text x="630" y="235" class="h">AI Agent</text>
  <text x="610" y="268" class="b">Claude Code / Cursor</text>
  <text x="605" y="296" class="small">例如：tap(login_button)</text>

  <!-- Arrow 1: AI Agent → MCP Server -->
  <line x1="700" y1="320" x2="700" y2="392" stroke="#3657C7" stroke-width="4.5" marker-end="url(#arrow)"/>
  <text x="720" y="358" class="tiny">MCP tool call</text>

  <!-- Layer 2: MCP Server -->
  <rect x="570" y="400" width="260" height="140" rx="24" fill="#EEF3FF" stroke="#6E86FF" stroke-width="3"/>
  <text x="615" y="455" class="h">MCP Server</text>
  <text x="610" y="488" class="b">flutter_copilot_mcp</text>
  <text x="605" y="516" class="small">工具路由 / 参数校验 / 结果返回</text>

  <!-- Arrow 2: MCP Server → VM Service -->
  <line x1="700" y1="540" x2="700" y2="612" stroke="#3657C7" stroke-width="4.5" marker-end="url(#arrow)"/>
  <text x="720" y="578" class="tiny">callServiceExtension</text>

  <!-- Layer 3: VM Service -->
  <rect x="565" y="620" width="270" height="140" rx="24" fill="#FFFFFF" stroke="#4B5EAA" stroke-width="3"/>
  <text x="615" y="675" class="h">VM Service</text>
  <text x="605" y="708" class="b">Dart / Flutter Runtime Debug API</text>
  <text x="615" y="736" class="small">调用 Service Extension</text>

  <!-- Arrow 3: VM Service → Flutter App -->
  <line x1="700" y1="760" x2="700" y2="832" stroke="#3657C7" stroke-width="4.5" marker-end="url(#arrow)"/>
  <text x="720" y="798" class="tiny">runtime execution</text>

  <!-- Layer 4: Flutter App -->
  <rect x="575" y="840" width="250" height="140" rx="24" fill="#EEF3FF" stroke="#4B5EAA" stroke-width="3"/>
  <text x="620" y="895" class="h">Flutter App</text>
  <text x="615" y="928" class="b">Binding / Widget Tree</text>
  <text x="613" y="956" class="small">执行点击 / 输入 / 截图 / 日志</text>

  <!-- Example Box -->
  <rect x="120" y="1000" width="1160" height="85" rx="28" fill="#FFFFFF" stroke="#D3DCF7" stroke-width="2"/>
  <text x="160" y="1040" class="h">示例：点击 login_button 的真实路径</text>
  <text x="160" y="1072" class="small">Agent → MCP → VM Service → FlutterCopilotBinding → GestureDispatcher</text>
</svg>
