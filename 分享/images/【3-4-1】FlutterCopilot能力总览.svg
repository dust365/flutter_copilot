<svg width="1400" height="980" viewBox="0 0 1400 980" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFF"/>
      <stop offset="100%" stop-color="#EEF4FF"/>
    </linearGradient>
    <style>
      .title { font: 700 34px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #1E2A4A; }
      .subtitle { font: 500 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #5D6B8A; }
      .h { font: 700 22px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #1E2A4A; }
      .b { font: 500 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #2F3A56; }
      .small { font: 500 15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #61708F; }
      .count { font: 700 30px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #3657C7; }
      .tag { font: 700 16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #3657C7; }
      .tool { font: 600 16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #2F3A56; }
    </style>
  </defs>

  <rect width="1400" height="980" rx="28" fill="url(#bg)"/>
  <text x="80" y="90" class="title">Flutter Copilot 能力总览</text>
  <text x="80" y="125" class="subtitle">15 个 MCP 工具，覆盖连接、观察、交互、导航、诊断五类能力</text>

  <!-- Summary -->
  <rect x="1040" y="55" width="250" height="100" rx="22" fill="#FFFFFF" stroke="#8EA3FF" stroke-width="2"/>
  <text x="1080" y="98" class="small">总计 MCP 工具</text>
  <text x="1080" y="135" class="count">15 个</text>

  <!-- Row 1 -->
  <rect x="80" y="190" width="380" height="220" rx="28" fill="#FFFFFF" stroke="#8EA3FF" stroke-width="3"/>
  <text x="120" y="245" class="h">连接管理</text>
  <text x="120" y="278" class="count">2</text>
  <text x="165" y="278" class="small">个工具</text>
  <text x="120" y="325" class="b">connect</text>
  <text x="120" y="360" class="b">disconnect</text>
  <text x="120" y="395" class="small">负责建立和断开 Flutter 运行时连接</text>

  <rect x="510" y="190" width="380" height="220" rx="28" fill="#FFFFFF" stroke="#6E86FF" stroke-width="3"/>
  <text x="550" y="245" class="h">观察能力</text>
  <text x="550" y="278" class="count">3</text>
  <text x="595" y="278" class="small">个工具</text>
  <text x="550" y="325" class="b">get_interactive_elements</text>
  <text x="550" y="360" class="b">take_screenshots</text>
  <text x="550" y="395" class="b">get_logs</text>

  <rect x="940" y="190" width="380" height="220" rx="28" fill="#FFFFFF" stroke="#4B5EAA" stroke-width="3"/>
  <text x="980" y="245" class="h">导航能力</text>
  <text x="980" y="278" class="count">1</text>
  <text x="1025" y="278" class="small">个工具（5 种操作）</text>
  <text x="980" y="325" class="b">navigate</text>
  <text x="980" y="360" class="small">push / pop / replace / pushNamed / popUntil</text>
  <text x="980" y="395" class="small">把页面跳转也纳入 Agent 可执行链路</text>

  <!-- Row 2 -->
  <rect x="80" y="460" width="810" height="290" rx="28" fill="#FFFFFF" stroke="#6E86FF" stroke-width="3"/>
  <text x="120" y="515" class="h">交互能力</text>
  <text x="120" y="548" class="count">7</text>
  <text x="165" y="548" class="small">个工具</text>

  <rect x="120" y="585" width="160" height="56" rx="16" fill="#EEF3FF"/>
  <text x="177" y="620" class="tool">tap</text>
  <rect x="300" y="585" width="160" height="56" rx="16" fill="#EEF3FF"/>
  <text x="335" y="620" class="tool">long_press</text>
  <rect x="480" y="585" width="160" height="56" rx="16" fill="#EEF3FF"/>
  <text x="520" y="620" class="tool">double_tap</text>
  <rect x="660" y="585" width="160" height="56" rx="16" fill="#EEF3FF"/>
  <text x="710" y="620" class="tool">enter_text</text>

  <rect x="120" y="665" width="160" height="56" rx="16" fill="#EEF3FF"/>
  <text x="162" y="700" class="tool">scroll_to</text>
  <rect x="300" y="665" width="160" height="56" rx="16" fill="#EEF3FF"/>
  <text x="360" y="700" class="tool">drag</text>
  <rect x="480" y="665" width="160" height="56" rx="16" fill="#EEF3FF"/>
  <text x="540" y="700" class="tool">swipe</text>

  <rect x="940" y="460" width="380" height="290" rx="28" fill="#FFFFFF" stroke="#8EA3FF" stroke-width="3"/>
  <text x="980" y="515" class="h">诊断能力</text>
  <text x="980" y="548" class="count">2</text>
  <text x="1025" y="548" class="small">个工具</text>
  <rect x="980" y="595" width="280" height="60" rx="18" fill="#FFF4D9"/>
  <text x="1020" y="633" class="b">hot_reload</text>
  <rect x="980" y="675" width="280" height="60" rx="18" fill="#FFF4D9"/>
  <text x="1005" y="713" class="b">get_rebuild_snapshot</text>
  <text x="980" y="770" class="small">让 AI 不只会操作，还能参与验证与定位</text>

  <!-- Bottom note -->
  <rect x="140" y="820" width="1120" height="90" rx="24" fill="#FFFFFF" stroke="#D6DFF8" stroke-width="2"/>
  <text x="190" y="865" class="tag">元素匹配方式</text>
  <text x="190" y="900" class="b">Key（最稳定） / 文本内容 / Widget 类型</text>
  <text x="680" y="900" class="small">这些能力组合起来，覆盖“观察 → 操作 → 诊断”的完整运行时协作链路</text>
</svg>
