<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="650" viewBox="0 0 1320 650" role="img" aria-labelledby="title desc">
  <title id="title">发现或启动 App，再按会话 ID 操作</title>
  <desc id="desc">从工程出发，复用已登记的 App，或选择设备启动。MCP 和 fcc 使用同一会话后端，按 App ID 选择目标。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9Z" fill="#6977b2"/></marker>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f0f4ff"/><stop offset="1" stop-color="#f9f6ff"/></linearGradient>
  </defs>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#151e3f}
    .title{font-size:40px;font-weight:800}.label{font-size:16px;font-weight:700;letter-spacing:2px;fill:#4c63e8}
    .head{font-size:24px;font-weight:700}.body{font-size:19px;fill:#454f76}
    .path{stroke:#6977b2;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
  </style>
  <rect width="1320" height="650" rx="28" fill="url(#bg)"/>
  <text x="64" y="62" class="label">FLUTTER COPILOT · V2.0.0</text>
  <text x="64" y="118" class="title">从 Flutter 工程找到要操作的 App</text>
  <path d="M308 318H344V232H382" class="path"/>
  <path d="M308 318H344V412H382" class="path"/>
  <path d="M724 232H755V318H792" class="path"/>
  <path d="M724 412H755V318H792" class="path"/>
  <path d="M1025 318H1070" class="path"/>
  <g>
    <rect x="64" y="248" width="244" height="140" rx="20" fill="#fff" stroke="#b8c6f5"/>
    <text x="88" y="293" class="head">指定 Flutter 工程</text>
    <text x="88" y="333" class="body">MCP 或 fcc</text>
    <text x="88" y="361" class="body">查找可用会话</text>
    <rect x="384" y="164" width="340" height="136" rx="20" fill="#f1fbf8" stroke="#abd9cf"/>
    <text x="410" y="209" class="head">已有可用 App：复用</text>
    <text x="410" y="247" class="body">通过 DTD 发现调试会话</text>
    <text x="410" y="274" class="body">原来的 flutter run 继续运行</text>
    <rect x="384" y="344" width="340" height="136" rx="20" fill="#fff7ec" stroke="#eccb9d"/>
    <text x="410" y="389" class="head">没有可用 App：启动</text>
    <text x="410" y="427" class="body">单台真机自动选中</text>
    <text x="410" y="454" class="body">有多个候选时选一台或多台</text>
    <rect x="794" y="248" width="231" height="140" rx="20" fill="#fff" stroke="#b8c6f5"/>
    <text x="818" y="293" class="head">共享会话后端</text>
    <text x="818" y="333" class="body">设备 A · App ID A</text>
    <text x="818" y="361" class="body">设备 B · App ID B</text>
    <rect x="1072" y="248" width="184" height="140" rx="20" fill="#e5e9ff" stroke="#b8c6f5"/>
    <text x="1094" y="293" class="head">选 App ID</text>
    <text x="1094" y="333" class="body">截图、点击</text>
    <text x="1094" y="361" class="body">热重载、热重启</text>
  </g>
  <rect x="64" y="538" width="1192" height="58" rx="14" fill="#fff" stroke="#d3daf7"/>
  <text x="88" y="574" class="body">多台设备可以同时在线。每次操作只发往选定的 App；MCP 和 fcc 看到同一批会话。</text>
</svg>
