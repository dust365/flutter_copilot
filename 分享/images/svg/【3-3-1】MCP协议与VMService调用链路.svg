<svg width="1500" height="1100" viewBox="0 0 1500 1100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFF"/>
      <stop offset="100%" stop-color="#EEF4FF"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4B5EAA"/>
    </marker>
    <style>
      .title { font: 700 34px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #1E2A4A; }
      .subtitle { font: 500 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #5D6B8A; }
      .h { font: 700 24px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #1E2A4A; }
      .b { font: 500 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #2F3A56; }
      .small { font: 500 16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #61708F; }
      .label { font: 500 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #61708F; }
    </style>
  </defs>
  <rect width="1500" height="1100" rx="28" fill="url(#bg)"/>
  <text x="80" y="90" class="title">MCP 协议与 VM Service 调用链路</text>
  <text x="80" y="125" class="subtitle">AI 发起工具调用 → MCP 翻译 → VM Service 传递 → Flutter App 执行</text>

  <!-- Layer 1: AI Agent -->
  <rect x="550" y="180" width="400" height="160" rx="26" fill="#FFFFFF" stroke="#8EA3FF" stroke-width="3"/>
  <text x="750" y="238" class="h" text-anchor="middle">AI Agent</text>
  <text x="750" y="275" class="b" text-anchor="middle">Claude Code / Cursor</text>
  <text x="750" y="310" class="small" text-anchor="middle">例如：tap(login_button)</text>

  <!-- Arrow 1 -->
  <line x1="750" y1="340" x2="750" y2="410" stroke="#4B5EAA" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="775" y="382" class="label">MCP tool call</text>

  <!-- Layer 2: MCP Server -->
  <rect x="550" y="420" width="400" height="160" rx="26" fill="#EEF3FF" stroke="#6E86FF" stroke-width="3"/>
  <text x="750" y="478" class="h" text-anchor="middle">MCP Server</text>
  <text x="750" y="515" class="b" text-anchor="middle">flutter_copilot_mcp</text>
  <text x="750" y="550" class="small" text-anchor="middle">工具路由 / 参数校验 / 结果返回</text>

  <!-- Arrow 2 -->
  <line x1="750" y1="580" x2="750" y2="650" stroke="#4B5EAA" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="775" y="622" class="label">callServiceExtension</text>

  <!-- Layer 3: VM Service -->
  <rect x="550" y="660" width="400" height="160" rx="26" fill="#FFFFFF" stroke="#4B5EAA" stroke-width="3"/>
  <text x="750" y="718" class="h" text-anchor="middle">VM Service</text>
  <text x="750" y="755" class="b" text-anchor="middle">Dart / Flutter Runtime Debug API</text>
  <text x="750" y="790" class="small" text-anchor="middle">调用 Service Extension</text>

  <!-- Arrow 3 -->
  <line x1="750" y1="820" x2="750" y2="890" stroke="#4B5EAA" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="775" y="862" class="label">runtime execution</text>

  <!-- Layer 4: Flutter App -->
  <rect x="550" y="900" width="400" height="160" rx="26" fill="#EEF3FF" stroke="#4B5EAA" stroke-width="3"/>
  <text x="750" y="958" class="h" text-anchor="middle">Flutter App</text>
  <text x="750" y="995" class="b" text-anchor="middle">Binding / Widget Tree</text>
  <text x="750" y="1030" class="small" text-anchor="middle">执行点击 / 输入 / 截图 / 日志</text>
</svg>
