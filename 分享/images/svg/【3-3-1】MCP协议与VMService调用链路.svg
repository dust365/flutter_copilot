<svg width="1500" height="1080" viewBox="0 0 1500 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6F9FF"/>
      <stop offset="100%" stop-color="#E9EFFF"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F7FF"/>
    </linearGradient>
    <linearGradient id="cardCli" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EEFBF8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7B8DFF"/><stop offset="100%" stop-color="#4057D6"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6EE7FF"/><stop offset="100%" stop-color="#3EA8FF"/>
    </linearGradient>
    <linearGradient id="indigo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8EA7FF"/><stop offset="100%" stop-color="#5B73E0"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B49AFF"/><stop offset="100%" stop-color="#7A5EE8"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1FB6A6"/><stop offset="100%" stop-color="#0D7F78"/>
    </linearGradient>
    <linearGradient id="tealLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5BD5C7"/><stop offset="100%" stop-color="#1FB6A6"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="4" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.14"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowDown" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#4C63E8"/>
    </marker>
    <marker id="arrowDownTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#0D7F78"/>
    </marker>
    <marker id="arrowUp" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#6EE7FF"/>
    </marker>
    <marker id="arrowUpTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#5BD5C7"/>
    </marker>
    <style>
      .tag { font: 700 13px 'SF Mono',Menlo,monospace; fill: #4C63E8; letter-spacing: 3px; }
      .title { font: 800 40px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif; fill: #151E3F; letter-spacing: 1px; }
      .subtitle { font: 500 18px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif; fill: #5D6B8A; }
      .layerTag { font: 700 11px 'SF Mono',Menlo,monospace; fill: #FFFFFF; letter-spacing: 2px; }
      .stepNum { font: 900 14px 'SF Mono',Menlo,monospace; fill: #FFFFFF; letter-spacing: 1px; }
      .h { font: 800 24px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif; fill: #151E3F; }
      .hSub { font: 500 15px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif; fill: #3A466B; }
      .code { font: 600 14px 'SF Mono','JetBrains Mono',Menlo,monospace; fill: #4C63E8; letter-spacing: 0.3px; }
      .codeTeal { font: 600 14px 'SF Mono','JetBrains Mono',Menlo,monospace; fill: #0D7F78; letter-spacing: 0.3px; }
      .arrowLabel { font: 700 12px 'SF Mono',Menlo,monospace; fill: #4C63E8; letter-spacing: 2px; }
      .arrowLabelTeal { font: 700 12px 'SF Mono',Menlo,monospace; fill: #0D7F78; letter-spacing: 2px; }
      .returnLabel { font: 600 12px 'SF Mono',Menlo,monospace; fill: #7383A8; letter-spacing: 1px; }
      .laneTitle { font: 800 14px 'SF Mono',Menlo,monospace; letter-spacing: 3px; }
    </style>
  </defs>

  <rect width="1500" height="1080" rx="28" fill="url(#bg)"/>

  <!-- header -->
  <text x="80" y="80" class="tag">CALL CHAIN · TWO ENTRIES, ONE RUNTIME</text>
  <text x="80" y="130" class="title">MCP 协议与 VM Service 调用链路</text>
  <text x="80" y="165" class="subtitle">AI Agent 走 MCP  ·  开发者 / 脚本走 CLI  →  共用 VM Service  →  落到 Flutter App</text>
  <rect x="80" y="180" width="72" height="4" rx="2" fill="url(#accent)"/>

  <!-- legend pills -->
  <g transform="translate(820, 80)">
    <rect width="180" height="32" rx="16" fill="#EEF3FF" stroke="#4C63E8" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="5" fill="#4C63E8"/>
    <text x="30" y="21" class="arrowLabel">MCP · AI 探索通道</text>
  </g>
  <g transform="translate(1020, 80)">
    <rect width="180" height="32" rx="16" fill="#E6FAF6" stroke="#1FB6A6" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="5" fill="#0D7F78"/>
    <text x="30" y="21" class="arrowLabelTeal">CLI · 终端 / 脚本通道</text>
  </g>
  <g transform="translate(1220, 80)">
    <rect width="200" height="32" rx="16" fill="#F2EEFF" stroke="#7A5EE8" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="5" fill="#7A5EE8"/>
    <text x="30" y="21" class="arrowLabel" style="fill:#5B3FD6">SHARED · 共用运行时</text>
  </g>

  <!-- Lane labels -->
  <text x="380" y="225" class="laneTitle" style="fill:#4C63E8">▸ AI AGENT LANE</text>
  <text x="900" y="225" class="laneTitle" style="fill:#0D7F78">▸ DEVELOPER / SCRIPT LANE</text>

  <!-- ================= LANE 1 (LEFT): AI → MCP ================= -->

  <!-- L1-A: AI Agent -->
  <g filter="url(#softShadow)">
    <rect x="380" y="245" width="460" height="130" rx="20" fill="url(#card)" stroke="#B8C6F5" stroke-width="1.5"/>
  </g>
  <rect x="380" y="245" width="460" height="6" fill="url(#accent)"/>
  <circle cx="412" cy="278" r="15" fill="url(#accent)"/>
  <text x="412" y="283" class="stepNum" text-anchor="middle">1</text>
  <rect x="436" y="266" width="70" height="22" rx="11" fill="url(#accent)"/>
  <text x="471" y="281" class="layerTag" text-anchor="middle">AGENT</text>
  <text x="610" y="320" class="h" text-anchor="middle">AI Agent</text>
  <text x="610" y="345" class="hSub" text-anchor="middle">Claude Code  ·  Cursor  ·  Skill 编排</text>
  <g transform="translate(490, 352)">
    <rect width="240" height="16" rx="8" fill="#EEF3FF"/>
    <text x="120" y="12" class="code" style="font-size:12px" text-anchor="middle">tap(login_button)</text>
  </g>

  <!-- ================= LANE 2 (RIGHT): Developer → CLI ================= -->

  <!-- L1-B: Developer / Script -->
  <g filter="url(#softShadow)">
    <rect x="900" y="245" width="460" height="130" rx="20" fill="url(#cardCli)" stroke="#9FE0D5" stroke-width="1.5"/>
  </g>
  <rect x="900" y="245" width="460" height="6" fill="url(#teal)"/>
  <circle cx="932" cy="278" r="15" fill="url(#teal)"/>
  <text x="932" y="283" class="stepNum" text-anchor="middle">2</text>
  <rect x="956" y="266" width="120" height="22" rx="11" fill="url(#teal)"/>
  <text x="1016" y="281" class="layerTag" text-anchor="middle">DEV  ·  CI  ·  SHELL</text>
  <text x="1130" y="320" class="h" text-anchor="middle">开发者 / 终端 / 脚本</text>
  <text x="1130" y="345" class="hSub" text-anchor="middle">手动调试  ·  自动化脚本  ·  CI 回放</text>
  <g transform="translate(1010, 352)">
    <rect width="240" height="16" rx="8" fill="#E6FAF6"/>
    <text x="120" y="12" class="codeTeal" style="font-size:12px" text-anchor="middle">$ fcc tap --key login_btn</text>
  </g>

  <!-- ===== Arrows L1 → L2 (left lane) ===== -->
  <g>
    <line x1="595" y1="395" x2="595" y2="455" stroke="#4C63E8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowDown)"/>
    <line x1="640" y1="455" x2="640" y2="395" stroke="#6EE7FF" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4" marker-end="url(#arrowUp)"/>
  </g>
  <g transform="translate(450, 408)" filter="url(#softShadow)">
    <rect width="130" height="26" rx="13" fill="#FFFFFF" stroke="#4C63E8" stroke-width="1.5"/>
    <text x="65" y="18" class="arrowLabel" text-anchor="middle">MCP tool call</text>
  </g>
  <text x="700" y="425" class="returnLabel">result json</text>

  <!-- ===== Arrows L1 → L2 (right lane) ===== -->
  <g>
    <line x1="1115" y1="395" x2="1115" y2="455" stroke="#0D7F78" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowDownTeal)"/>
    <line x1="1160" y1="455" x2="1160" y2="395" stroke="#5BD5C7" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4" marker-end="url(#arrowUpTeal)"/>
  </g>
  <g transform="translate(960, 408)" filter="url(#softShadow)">
    <rect width="150" height="26" rx="13" fill="#FFFFFF" stroke="#0D7F78" stroke-width="1.5"/>
    <text x="75" y="18" class="arrowLabelTeal" text-anchor="middle">stdin / argv 解析</text>
  </g>
  <text x="1220" y="425" class="returnLabel">stdout / exit</text>

  <!-- L2-A: MCP Server -->
  <g filter="url(#softShadow)">
    <rect x="380" y="475" width="460" height="130" rx="20" fill="url(#card)" stroke="#7B8DFF" stroke-width="2"/>
  </g>
  <rect x="380" y="475" width="460" height="6" fill="url(#indigo)"/>
  <circle cx="412" cy="508" r="15" fill="url(#indigo)"/>
  <text x="412" y="513" class="stepNum" text-anchor="middle">3</text>
  <rect x="436" y="496" width="100" height="22" rx="11" fill="url(#indigo)"/>
  <text x="486" y="511" class="layerTag" text-anchor="middle">MCP SERVER</text>
  <text x="610" y="550" class="h" text-anchor="middle">flutter_copilot_mcp</text>
  <text x="610" y="578" class="hSub" text-anchor="middle">工具路由  ·  参数校验  ·  结构化返回</text>

  <!-- L2-B: CLI -->
  <g filter="url(#softShadow)">
    <rect x="900" y="475" width="460" height="130" rx="20" fill="url(#cardCli)" stroke="#1FB6A6" stroke-width="2"/>
  </g>
  <rect x="900" y="475" width="460" height="6" fill="url(#tealLight)"/>
  <circle cx="932" cy="508" r="15" fill="url(#teal)"/>
  <text x="932" y="513" class="stepNum" text-anchor="middle">4</text>
  <rect x="956" y="496" width="120" height="22" rx="11" fill="url(#teal)"/>
  <text x="1016" y="511" class="layerTag" text-anchor="middle">CLI  ·  fcc</text>
  <text x="1130" y="550" class="h" text-anchor="middle">flutter_copilot_cli</text>
  <text x="1130" y="578" class="hSub" text-anchor="middle">命令解析  ·  .vm_service_uri  ·  脚本回放</text>

  <!-- ===== Convergence: both lanes call vm_service via callServiceExtension ===== -->
  <g>
    <!-- Left lane down to merge -->
    <path d="M 610 615 L 610 660 L 720 695" stroke="#4C63E8" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrowDown)"/>
    <path d="M 720 705 L 660 670 L 660 615" stroke="#6EE7FF" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4" fill="none" marker-end="url(#arrowUp)"/>
    <!-- Right lane down to merge -->
    <path d="M 1130 615 L 1130 660 L 820 695" stroke="#0D7F78" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrowDownTeal)"/>
    <path d="M 820 705 L 1080 670 L 1080 615" stroke="#5BD5C7" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4" fill="none" marker-end="url(#arrowUpTeal)"/>
  </g>

  <!-- merge label -->
  <g transform="translate(620, 627)" filter="url(#softShadow)">
    <rect width="240" height="28" rx="14" fill="#FFFFFF" stroke="#7A5EE8" stroke-width="1.5"/>
    <text x="120" y="19" class="arrowLabel" style="fill:#5B3FD6" text-anchor="middle">callServiceExtension</text>
  </g>

  <!-- L3: VM Service (full width, shared) -->
  <g filter="url(#softShadow)">
    <rect x="380" y="715" width="980" height="130" rx="22" fill="url(#card)" stroke="#B49AFF" stroke-width="2"/>
  </g>
  <rect x="380" y="715" width="980" height="6" fill="url(#violet)"/>
  <circle cx="414" cy="748" r="16" fill="url(#violet)"/>
  <text x="414" y="753" class="stepNum" text-anchor="middle">5</text>
  <rect x="440" y="736" width="100" height="22" rx="11" fill="url(#violet)"/>
  <text x="490" y="751" class="layerTag" text-anchor="middle">VM SERVICE</text>
  <rect x="546" y="736" width="120" height="22" rx="11" fill="#F2EEFF" stroke="#7A5EE8" stroke-width="1"/>
  <text x="606" y="751" class="layerTag" style="fill:#5B3FD6" text-anchor="middle">SHARED RUNTIME</text>
  <text x="870" y="788" class="h" text-anchor="middle">VM Service</text>
  <text x="870" y="815" class="hSub" text-anchor="middle">Dart / Flutter Runtime Debug API  —  调用已注册的 Service Extension</text>

  <!-- ===== Arrows L3 → L4 ===== -->
  <g>
    <line x1="840" y1="865" x2="840" y2="925" stroke="#4C63E8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowDown)"/>
    <line x1="900" y1="925" x2="900" y2="865" stroke="#6EE7FF" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4" marker-end="url(#arrowUp)"/>
  </g>
  <g transform="translate(620, 880)" filter="url(#softShadow)">
    <rect width="200" height="26" rx="13" fill="#FFFFFF" stroke="#4C63E8" stroke-width="1.5"/>
    <text x="100" y="18" class="arrowLabel" text-anchor="middle">runtime execution</text>
  </g>
  <text x="1000" y="895" class="returnLabel">data / status</text>

  <!-- L4: Flutter App strip -->
  <g filter="url(#softShadow)">
    <rect x="380" y="945" width="980" height="36" rx="18" fill="url(#cyan)"/>
  </g>
  <text x="870" y="968" class="layerTag" style="font-size:13px" text-anchor="middle">▼  FLUTTER APP  ·  Binding · Widget Tree · 执行点击 / 输入 / 截图 / 日志  ▼</text>

  <!-- ===== Left annotation column ===== -->
  <g transform="translate(80, 250)">
    <rect x="0" y="0" width="280" height="125" rx="14" fill="#FFFFFF" fill-opacity="0.6" stroke="#D5DDF5" stroke-width="1"/>
    <text x="20" y="28" class="arrowLabel">STEP 1  ·  入口</text>
    <text x="20" y="58" class="hSub" style="font-weight:700">两条入口，按场景挑</text>
    <text x="20" y="82" class="hSub" style="font-size:13px; fill:#5D6B8A">AI 走 MCP 做探索 ·</text>
    <text x="20" y="100" class="hSub" style="font-size:13px; fill:#5D6B8A">开发者 / 脚本走 CLI</text>
    <text x="20" y="118" class="hSub" style="font-size:13px; fill:#5D6B8A">做调试和固化</text>
  </g>
  <g transform="translate(80, 480)">
    <rect x="0" y="0" width="280" height="125" rx="14" fill="#FFFFFF" fill-opacity="0.6" stroke="#D5DDF5" stroke-width="1"/>
    <text x="20" y="28" class="arrowLabel">STEP 2  ·  翻译</text>
    <text x="20" y="58" class="hSub" style="font-weight:700">把意图翻译成扩展调用</text>
    <text x="20" y="82" class="hSub" style="font-size:13px; fill:#5D6B8A">MCP 路由 tool · CLI 解析</text>
    <text x="20" y="100" class="hSub" style="font-size:13px; fill:#5D6B8A">命令，最终都收敛到</text>
    <text x="20" y="118" class="hSub" style="font-size:13px; fill:#5D6B8A">callServiceExtension</text>
  </g>
  <g transform="translate(80, 720)">
    <rect x="0" y="0" width="280" height="125" rx="14" fill="#FFFFFF" fill-opacity="0.6" stroke="#D5DDF5" stroke-width="1"/>
    <text x="20" y="28" class="arrowLabel">STEP 3  ·  下发</text>
    <text x="20" y="58" class="hSub" style="font-weight:700">VM Service 共用运行时</text>
    <text x="20" y="82" class="hSub" style="font-size:13px; fill:#5D6B8A">两条链路最终调用同一</text>
    <text x="20" y="100" class="hSub" style="font-size:13px; fill:#5D6B8A">套 ext.flutter.copilot.*</text>
    <text x="20" y="118" class="hSub" style="font-size:13px; fill:#5D6B8A">扩展，能力对齐</text>
  </g>

  <!-- ===== Right side: response samples (split: MCP json + CLI stdout) ===== -->
  <g transform="translate(1380, 245)">
    <rect x="0" y="0" width="100" height="600" rx="14" fill="#0F1630"/>
    <text x="50" y="30" class="arrowLabel" style="fill:#6EE7FF" text-anchor="middle">RESP</text>
    <text x="50" y="50" class="arrowLabelTeal" style="fill:#5BD5C7" text-anchor="middle">SAMPLE</text>

    <!-- MCP json sample -->
    <rect x="6" y="70" width="88" height="240" rx="10" fill="#1A2547"/>
    <text x="14" y="90" class="arrowLabel" style="fill:#8EA7FF; font-size:10px">MCP · JSON</text>
    <g transform="translate(12, 108)" fill="#C8D4F5" style="font: 500 10px 'SF Mono',Menlo,monospace">
      <text y="0">{</text>
      <text y="16">  "tool":</text>
      <text y="30" style="fill:#6EE7FF">    "tap",</text>
      <text y="46">  "status":</text>
      <text y="60" style="fill:#A8F0B8">    "ok",</text>
      <text y="76">  "rebuild": 3,</text>
      <text y="92">  "elapsedMs":</text>
      <text y="106" style="fill:#FFB86B">    142,</text>
      <text y="122">  "screenshot",</text>
      <text y="138">  "logs": [...]</text>
      <text y="154">}</text>
      <text y="178" style="fill:#7383A8">// Agent 据</text>
      <text y="192" style="fill:#7383A8">// 此续推</text>
    </g>

    <!-- CLI stdout sample -->
    <rect x="6" y="320" width="88" height="270" rx="10" fill="#0E2A26"/>
    <text x="14" y="340" class="arrowLabelTeal" style="fill:#5BD5C7; font-size:10px">CLI · STDOUT</text>
    <g transform="translate(12, 358)" fill="#C8E8E0" style="font: 500 10px 'SF Mono',Menlo,monospace">
      <text y="0" style="fill:#5BD5C7">$ fcc tap</text>
      <text y="14" style="fill:#5BD5C7">  --key</text>
      <text y="28" style="fill:#5BD5C7">  login_btn</text>
      <text y="50" style="fill:#A8F0B8">✓ ok</text>
      <text y="66">elapsed: 142ms</text>
      <text y="80">rebuild: 3</text>
      <text y="100" style="fill:#FFB86B">→ exit 0</text>
      <text y="124" style="fill:#7383A8">// 终端 / CI</text>
      <text y="138" style="fill:#7383A8">// 直接拿到</text>
      <text y="152" style="fill:#7383A8">// 状态码</text>
    </g>
  </g>

  <!-- bottom hint -->
  <text x="750" y="1030" class="hSub" style="fill:#5D6B8A; font-size:14px" text-anchor="middle">两条入口共享同一套 VM Service 扩展，能力对齐  ·  source: packages/flutter_copilot_cli/src/vm/connector.ts ＆ flutter_copilot_mcp</text>
  <rect x="640" y="1045" width="220" height="3" rx="1.5" fill="url(#violet)"/>
</svg>
