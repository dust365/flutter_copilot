<svg width="1500" height="900" viewBox="0 0 1500 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFF"/>
      <stop offset="100%" stop-color="#EEF4FF"/>
    </linearGradient>
    <style>
      .title { font: 700 34px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #1E2A4A; }
      .subtitle { font: 500 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #5D6B8A; }
      .axis { font: 500 16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #7A88A8; }
      .metric { font: 600 20px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #2F3A56; }
      .labelBefore { font: 600 16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #C0392B; }
      .labelAfter { font: 600 16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #1E9E57; }
      .summary { font: 700 22px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #1E2A4A; }
      .small { font: 500 16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #61708F; }
    </style>
  </defs>

  <rect width="1500" height="900" rx="28" fill="url(#bg)"/>

  <text x="80" y="90" class="title">接入前 VS 接入后</text>
  <text x="80" y="125" class="subtitle">双柱状图表达：红色代表接入前，绿色代表接入后；示意数据可按真实结果替换</text>

  <!-- Legend -->
  <rect x="1000" y="78" width="22" height="22" rx="5" fill="#E85B52"/>
  <text x="1034" y="95" class="small">接入前</text>
  <rect x="1140" y="78" width="22" height="22" rx="5" fill="#2DBE6C"/>
  <text x="1174" y="95" class="small">接入后</text>

  <!-- Chart area -->
  <rect x="80" y="170" width="1340" height="530" rx="26" fill="#FFFFFF" stroke="#D6DFF8" stroke-width="2"/>

  <!-- Grid lines -->
  <line x1="140" y1="630" x2="1370" y2="630" stroke="#BFCBE8" stroke-width="2"/>
  <line x1="140" y1="530" x2="1370" y2="530" stroke="#E6ECFA" stroke-width="1.5"/>
  <line x1="140" y1="430" x2="1370" y2="430" stroke="#E6ECFA" stroke-width="1.5"/>
  <line x1="140" y1="330" x2="1370" y2="330" stroke="#E6ECFA" stroke-width="1.5"/>
  <line x1="140" y1="230" x2="1370" y2="230" stroke="#E6ECFA" stroke-width="1.5"/>

  <!-- Y-axis labels -->
  <text x="105" y="635" class="axis">0</text>
  <text x="96" y="535" class="axis">25</text>
  <text x="96" y="435" class="axis">50</text>
  <text x="96" y="335" class="axis">75</text>
  <text x="90" y="235" class="axis">100</text>
  <text x="130" y="665" class="axis">相对耗时 / 人工投入指数</text>

  <!-- Metric 1: 表单验证 -->
  <rect x="230" y="230" width="68" height="400" rx="10" fill="#E85B52"/>
  <rect x="312" y="530" width="68" height="100" rx="10" fill="#2DBE6C"/>
  <text x="214" y="205" class="labelBefore">2~3 分钟</text>
  <text x="296" y="505" class="labelAfter">20~40 秒</text>
  <text x="260" y="728" class="metric" text-anchor="middle">表单验证</text>

  <!-- Metric 2: 日志排查 -->
  <rect x="510" y="230" width="68" height="400" rx="10" fill="#E85B52"/>
  <rect x="592" y="490" width="68" height="140" rx="10" fill="#2DBE6C"/>
  <text x="494" y="205" class="labelBefore">5~10 分钟</text>
  <text x="578" y="465" class="labelAfter">1~3 分钟</text>
  <text x="540" y="728" class="metric" text-anchor="middle">日志排查</text>

  <!-- Metric 3: 人工参与 -->
  <rect x="790" y="230" width="68" height="400" rx="10" fill="#E85B52"/>
  <rect x="872" y="550" width="68" height="80" rx="10" fill="#2DBE6C"/>
  <text x="770" y="205" class="labelBefore">5~7 次操作</text>
  <text x="856" y="525" class="labelAfter">1~2 次指令</text>
  <text x="820" y="728" class="metric" text-anchor="middle">人工参与</text>

  <!-- Metric 4: 反馈闭环 -->
  <rect x="1070" y="230" width="68" height="400" rx="10" fill="#E85B52"/>
  <rect x="1152" y="510" width="68" height="120" rx="10" fill="#2DBE6C"/>
  <text x="1050" y="205" class="labelBefore">10~15 分钟</text>
  <text x="1136" y="485" class="labelAfter">3~5 分钟</text>
  <text x="1100" y="728" class="metric" text-anchor="middle">反馈闭环</text>

  <!-- Bottom summary -->
  <rect x="80" y="770" width="1340" height="100" rx="22" fill="#FFF4D9" stroke="#F1B55C" stroke-width="2"/>
  <text x="130" y="812" class="summary">综合结论：多角色协作效率整体提升 30%~40%</text>
  <text x="130" y="846" class="small">核心价值不是只省几分钟，而是把"验证、观察、定位、反馈"压缩成一条 Agent 可执行的闭环。</text>
</svg>
