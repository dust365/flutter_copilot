<svg width="1500" height="900" viewBox="0 0 1500 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6F9FF"/>
      <stop offset="100%" stop-color="#E9EFFF"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F7FF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7B8DFF"/><stop offset="100%" stop-color="#4057D6"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6EE7FF"/><stop offset="100%" stop-color="#3EA8FF"/>
    </linearGradient>
    <linearGradient id="indigo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8EA7FF"/><stop offset="100%" stop-color="#5B73E0"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD180"/><stop offset="100%" stop-color="#F0A03D"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="4" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.14"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#4C63E8"/>
    </marker>
    <style>
      .tag { font: 700 13px 'SF Mono',Menlo,monospace; fill: #4C63E8; letter-spacing: 3px; }
      .title { font: 800 40px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif; fill: #151E3F; letter-spacing: 1px; }
      .subtitle { font: 500 18px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif; fill: #5D6B8A; }
      .stepTag { font: 700 11px 'SF Mono',Menlo,monospace; fill: #FFFFFF; letter-spacing: 2px; }
      .stepNum { font: 900 44px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #FFFFFF; letter-spacing: 1px; }
      .h { font: 800 24px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif; fill: #151E3F; }
      .b { font: 500 16px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif; fill: #3A466B; }
      .small { font: 500 14px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif; fill: #7383A8; }
      .code { font: 600 13px 'SF Mono','JetBrains Mono',Menlo,monospace; fill: #4C63E8; letter-spacing: 0.3px; }
      .metricH { font: 800 18px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif; fill: #1A234A; }
      .metricBefore { font: 600 14px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif; fill: #C65B4D; }
      .metricAfter { font: 700 15px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif; fill: #4C63E8; }
      .arrow { font: 600 14px 'SF Mono',Menlo,monospace; fill: #7383A8; }
      .valueTag { font: 800 20px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif; fill: #1A234A; }
      .valueSub { font: 500 15px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif; fill: #5D6B8A; }
    </style>
  </defs>

  <rect width="1500" height="900" rx="28" fill="url(#bg)"/>

  <!-- header -->
  <text x="80" y="80" class="tag">ONBOARDING · 3 STEPS + IMPACT</text>
  <text x="80" y="130" class="title">接入路径与提效指标示意图</text>
  <text x="80" y="165" class="subtitle">三步接入 + 接入前后核心效率指标（示意数据，可替换）</text>
  <rect x="80" y="180" width="72" height="4" rx="2" fill="url(#accent)"/>

  <!-- Three step cards on a horizontal timeline -->
  <!-- timeline bar -->
  <line x1="180" y1="330" x2="1420" y2="330" stroke="#D7DFF5" stroke-width="3" stroke-dasharray="2 6"/>

  <!-- Step 1 -->
  <g filter="url(#softShadow)">
    <rect x="80" y="220" width="440" height="230" rx="22" fill="url(#card)" stroke="#B8C6F5" stroke-width="1.5"/>
  </g>
  <rect x="80" y="220" width="440" height="6" fill="url(#accent)"/>
  <g transform="translate(150, 330)">
    <circle r="40" fill="url(#accent)"/>
    <circle r="40" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <text y="15" class="stepNum" text-anchor="middle">1</text>
  </g>
  <rect x="210" y="250" width="100" height="22" rx="11" fill="url(#accent)"/>
  <text x="260" y="265" class="stepTag" text-anchor="middle">IN-APP SETUP</text>
  <text x="210" y="298" class="h">App 内接入</text>
  <text x="210" y="328" class="b">引入 flutter_copilot_claw</text>
  <g transform="translate(210, 348)">
    <rect width="290" height="28" rx="8" fill="#EEF3FF"/>
    <text x="12" y="19" class="code">runAppWithConfig(app, config)</text>
  </g>
  <text x="210" y="410" class="small">通常只需要修改入口初始化</text>

  <!-- Arrow 1→2 -->
  <path d="M530 330 L560 330" stroke="#4C63E8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <g filter="url(#softShadow)">
    <rect x="580" y="220" width="340" height="230" rx="22" fill="url(#card)" stroke="#7B8DFF" stroke-width="2"/>
  </g>
  <rect x="580" y="220" width="340" height="6" fill="url(#indigo)"/>
  <g transform="translate(650, 330)">
    <circle r="40" fill="url(#indigo)"/>
    <circle r="40" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <text y="15" class="stepNum" text-anchor="middle">2</text>
  </g>
  <rect x="710" y="250" width="82" height="22" rx="11" fill="url(#indigo)"/>
  <text x="751" y="265" class="stepTag" text-anchor="middle">BRIDGE</text>
  <text x="710" y="298" class="h">启动桥接</text>
  <text x="710" y="328" class="b">启动 flutter_copilot_mcp</text>
  <g transform="translate(710, 348)">
    <rect width="190" height="28" rx="8" fill="#EEF3FF"/>
    <text x="12" y="19" class="code">npx flutter-copilot</text>
  </g>
  <text x="710" y="410" class="small">连接 VM Service，暴露 MCP 工具</text>

  <!-- Arrow 2→3 -->
  <path d="M930 330 L960 330" stroke="#4C63E8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <g filter="url(#softShadow)">
    <rect x="980" y="220" width="440" height="230" rx="22" fill="url(#card)" stroke="#B8C6F5" stroke-width="1.5"/>
  </g>
  <rect x="980" y="220" width="440" height="6" fill="url(#cyan)"/>
  <g transform="translate(1050, 330)">
    <circle r="40" fill="url(#cyan)"/>
    <circle r="40" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <text y="15" class="stepNum" text-anchor="middle">3</text>
  </g>
  <rect x="1110" y="250" width="100" height="22" rx="11" fill="url(#cyan)"/>
  <text x="1160" y="265" class="stepTag" text-anchor="middle">AGENT CONFIG</text>
  <text x="1110" y="298" class="h">Agent 侧配置</text>
  <text x="1110" y="328" class="b">Cursor · Claude Code 配置 MCP</text>
  <g transform="translate(1110, 348)">
    <rect width="290" height="28" rx="8" fill="#E6F6FF"/>
    <text x="12" y="19" class="code" style="fill:#2E7FAC">.mcp.json → flutter-copilot</text>
  </g>
  <text x="1110" y="410" class="small">从代码助手进入运行时助手</text>

  <!-- Metrics panel -->
  <g filter="url(#softShadow)">
    <rect x="80" y="500" width="1340" height="290" rx="22" fill="url(#card)" stroke="#B8C6F5" stroke-width="1.5"/>
  </g>
  <rect x="80" y="500" width="6" height="290" rx="3" fill="url(#amber)"/>
  <text x="110" y="540" class="tag" style="fill:#E68A3D">IMPACT METRICS · 接入前后</text>
  <text x="110" y="570" class="h">接入前后提效指标（示意）</text>

  <!-- 5 metric rows -->
  <g transform="translate(110, 600)">
    <!-- row 1 -->
    <g>
      <circle cx="8" cy="10" r="5" fill="url(#accent)"/>
      <text x="24" y="15" class="metricH">单次表单验证</text>
      <text x="240" y="15" class="metricBefore">2~3 分钟</text>
      <text x="340" y="15" class="arrow">→</text>
      <text x="370" y="15" class="metricAfter">20~40 秒</text>
    </g>
    <g transform="translate(0, 36)">
      <circle cx="8" cy="10" r="5" fill="url(#accent)"/>
      <text x="24" y="15" class="metricH">一次日志排查</text>
      <text x="240" y="15" class="metricBefore">5~10 分钟</text>
      <text x="340" y="15" class="arrow">→</text>
      <text x="370" y="15" class="metricAfter">1~3 分钟</text>
    </g>
    <g transform="translate(0, 72)">
      <circle cx="8" cy="10" r="5" fill="url(#accent)"/>
      <text x="24" y="15" class="metricH">问题复现准备</text>
      <text x="240" y="15" class="metricBefore">人工手动串流程</text>
      <text x="370" y="15" class="arrow">→</text>
      <text x="400" y="15" class="metricAfter">Agent 自动执行 + 截图 / 日志</text>
    </g>
    <g transform="translate(0, 108)">
      <circle cx="8" cy="10" r="5" fill="url(#accent)"/>
      <text x="24" y="15" class="metricH">产品确认核心流程</text>
      <text x="240" y="15" class="metricBefore">依赖开发 / 测试回放</text>
      <text x="400" y="15" class="arrow">→</text>
      <text x="430" y="15" class="metricAfter">Agent 直接执行并反馈</text>
    </g>
    <g transform="translate(0, 144)">
      <circle cx="8" cy="10" r="5" fill="url(#accent)"/>
      <text x="24" y="15" class="metricH">重绘热点定位</text>
      <text x="240" y="15" class="metricBefore">手工看 DevTools</text>
      <text x="370" y="15" class="arrow">→</text>
      <text x="400" y="15" class="metricAfter">一次快照 + Agent 解释</text>
    </g>
  </g>

  <!-- Core value callout (right side of metrics) -->
  <g filter="url(#softShadow)">
    <rect x="980" y="580" width="420" height="180" rx="18" fill="url(#accent)"/>
  </g>
  <text x="1010" y="618" class="tag" style="fill:#C8D4F5">CORE VALUE</text>
  <text x="1010" y="658" class="h" style="fill:#FFFFFF">不是只省几分钟</text>
  <text x="1010" y="696" class="valueTag" style="fill:#FFFFFF; font-size:18px">而是把"验证 · 观察 · 定位 · 反馈"</text>
  <text x="1010" y="724" class="valueTag" style="fill:#FFD180; font-size:18px">串成一条 Agent 可执行的闭环</text>

  <!-- Bottom helper note -->
  <text x="80" y="860" class="small" style="font-size:13px">提示：数据为示意值，可根据真实团队场景替换；核心在于"从人工循环 → Agent 循环"的范式迁移。</text>
</svg>
