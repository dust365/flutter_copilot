<svg width="1500" height="900" viewBox="0 0 1500 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFF"/>
      <stop offset="100%" stop-color="#EEF4FF"/>
    </linearGradient>
    <style>
      .title { font: 700 34px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #1E2A4A; }
      .subtitle { font: 500 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #5D6B8A; }
      .h { font: 700 24px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #1E2A4A; }
      .b { font: 500 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #2F3A56; }
      .small { font: 500 16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #61708F; }
    </style>
  </defs>
  <rect width="1500" height="900" rx="28" fill="url(#bg)"/>
  <text x="80" y="90" class="title">接入路径与提效指标示意图</text>
  <text x="80" y="125" class="subtitle">三步接入 + 接入前后核心效率指标（示意数据，可替换）</text>

  <!-- Step 1 -->
  <rect x="80" y="190" width="420" height="190" rx="26" fill="#FFFFFF" stroke="#8EA3FF" stroke-width="3"/>
  <text x="120" y="248" class="h">Step 1 · App 内接入</text>
  <text x="120" y="290" class="b">引入 flutter_copilot_claw</text>
  <text x="120" y="325" class="b">初始化 Binding / runAppWithConfig</text>
  <text x="120" y="362" class="small">通常只需要修改入口初始化</text>

  <!-- Step 2 -->
  <rect x="540" y="190" width="420" height="190" rx="26" fill="#EEF3FF" stroke="#6E86FF" stroke-width="3"/>
  <text x="580" y="248" class="h">Step 2 · App 外起桥接</text>
  <text x="580" y="290" class="b">启动 flutter_copilot_mcp</text>
  <text x="580" y="325" class="b">连接 VM Service / 暴露 MCP 工具</text>
  <text x="580" y="362" class="small">把 Flutter 运行时能力带给 Agent</text>

  <!-- Step 3 -->
  <rect x="1000" y="190" width="420" height="190" rx="26" fill="#FFFFFF" stroke="#4B5EAA" stroke-width="3"/>
  <text x="1040" y="248" class="h">Step 3 · Agent 侧配置</text>
  <text x="1040" y="290" class="b">Cursor / Claude Code 配置 MCP</text>
  <text x="1040" y="325" class="b">让 Agent 知道有哪些工具可调用</text>
  <text x="1040" y="362" class="small">从代码助手进入运行时助手</text>

  <!-- Metrics area -->
  <rect x="80" y="460" width="1340" height="330" rx="28" fill="#FFFFFF" stroke="#D6DFF8" stroke-width="2"/>
  <text x="120" y="520" class="h">接入前后提效指标（示意）</text>

  <text x="120" y="575" class="b">• 单次表单验证耗时：2~3 分钟 → 20~40 秒</text>
  <text x="120" y="615" class="b">• 一次日志排查耗时：5~10 分钟 → 1~3 分钟</text>
  <text x="120" y="655" class="b">• 问题复现准备动作：人工手动串流程 → Agent 自动执行并拿截图 / 日志</text>
  <text x="120" y="695" class="b">• 产品确认核心流程：依赖开发 / 测试回放 → Agent 可直接执行并反馈结果</text>
  <text x="120" y="735" class="b">• 重绘热点定位：手工看 DevTools → 一次快照 + Agent 辅助解释</text>

  <!-- Core value highlight -->
  <rect x="980" y="545" width="370" height="175" rx="22" fill="#EEF3FF" stroke="#6E86FF"/>
  <text x="1020" y="592" class="h">核心价值</text>
  <text x="1020" y="632" class="b">不是只节省几分钟，</text>
  <text x="1020" y="664" class="b">而是把"验证、观察、定位、反馈"</text>
  <text x="1020" y="696" class="b">串成一条 Agent 可执行的闭环。</text>
</svg>
