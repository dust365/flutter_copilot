<svg width="1500" height="980" viewBox="0 0 1500 980" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFF"/>
      <stop offset="100%" stop-color="#EEF4FF"/>
    </linearGradient>
    <style>
      .title { font: 700 34px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #1E2A4A; }
      .subtitle { font: 500 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #5D6B8A; }
      .h { font: 700 24px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #1E2A4A; }
      .b { font: 500 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #2F3A56; }
      .small { font: 500 16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #61708F; }
      .count { font: 700 30px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #3657C7; }
      .tag { font: 700 16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #3657C7; }
      .tool { font: 600 16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #2F3A56; }
    </style>
  </defs>

  <rect width="1500" height="980" rx="28" fill="url(#bg)"/>
  <text x="80" y="90" class="title">Flutter Copilot 能力总览</text>
  <text x="80" y="125" class="subtitle">15 个 MCP 工具，覆盖连接、观察、交互、导航、诊断五类能力</text>

  <!-- Summary badge -->
  <rect x="1140" y="55" width="260" height="100" rx="22" fill="#FFFFFF" stroke="#8EA3FF" stroke-width="2"/>
  <text x="1270" y="98" class="small" text-anchor="middle">总计 MCP 工具</text>
  <text x="1270" y="135" class="count" text-anchor="middle">15 个</text>

  <!-- Row 1: 连接管理 -->
  <rect x="80" y="190" width="400" height="230" rx="28" fill="#FFFFFF" stroke="#8EA3FF" stroke-width="3"/>
  <text x="120" y="248" class="h">连接管理</text>
  <text x="120" y="283" class="count">2</text>
  <text x="168" y="283" class="small">个工具</text>
  <text x="120" y="330" class="b">connect</text>
  <text x="120" y="365" class="b">disconnect</text>
  <text x="120" y="402" class="small">负责建立和断开 Flutter 运行时连接</text>

  <!-- Row 1: 观察能力 -->
  <rect x="530" y="190" width="420" height="230" rx="28" fill="#FFFFFF" stroke="#6E86FF" stroke-width="3"/>
  <text x="570" y="248" class="h">观察能力</text>
  <text x="570" y="283" class="count">3</text>
  <text x="618" y="283" class="small">个工具</text>
  <text x="570" y="330" class="b">get_interactive_elements</text>
  <text x="570" y="365" class="b">take_screenshots</text>
  <text x="570" y="400" class="b">get_logs</text>

  <!-- Row 1: 导航能力 -->
  <rect x="1000" y="190" width="400" height="230" rx="28" fill="#FFFFFF" stroke="#4B5EAA" stroke-width="3"/>
  <text x="1040" y="248" class="h">导航能力</text>
  <text x="1040" y="283" class="count">1</text>
  <text x="1088" y="283" class="small">个工具（5 种操作）</text>
  <text x="1040" y="330" class="b">navigate</text>
  <text x="1040" y="365" class="small">push / pop / replace / pushNamed / popUntil</text>
  <text x="1040" y="402" class="small">把页面跳转也纳入 Agent 可执行链路</text>

  <!-- Row 2: 交互能力 -->
  <rect x="80" y="470" width="860" height="300" rx="28" fill="#FFFFFF" stroke="#6E86FF" stroke-width="3"/>
  <text x="120" y="528" class="h">交互能力</text>
  <text x="120" y="563" class="count">7</text>
  <text x="168" y="563" class="small">个工具</text>

  <rect x="120" y="600" width="170" height="56" rx="16" fill="#EEF3FF"/>
  <text x="205" y="635" class="tool" text-anchor="middle">tap</text>
  <rect x="310" y="600" width="170" height="56" rx="16" fill="#EEF3FF"/>
  <text x="395" y="635" class="tool" text-anchor="middle">long_press</text>
  <rect x="500" y="600" width="170" height="56" rx="16" fill="#EEF3FF"/>
  <text x="585" y="635" class="tool" text-anchor="middle">double_tap</text>
  <rect x="690" y="600" width="170" height="56" rx="16" fill="#EEF3FF"/>
  <text x="775" y="635" class="tool" text-anchor="middle">enter_text</text>

  <rect x="120" y="680" width="170" height="56" rx="16" fill="#EEF3FF"/>
  <text x="205" y="715" class="tool" text-anchor="middle">scroll_to</text>
  <rect x="310" y="680" width="170" height="56" rx="16" fill="#EEF3FF"/>
  <text x="395" y="715" class="tool" text-anchor="middle">drag</text>
  <rect x="500" y="680" width="170" height="56" rx="16" fill="#EEF3FF"/>
  <text x="585" y="715" class="tool" text-anchor="middle">swipe</text>

  <!-- Row 2: 诊断能力 -->
  <rect x="990" y="470" width="410" height="300" rx="28" fill="#FFFFFF" stroke="#8EA3FF" stroke-width="3"/>
  <text x="1030" y="528" class="h">诊断能力</text>
  <text x="1030" y="563" class="count">2</text>
  <text x="1078" y="563" class="small">个工具</text>
  <rect x="1030" y="600" width="320" height="60" rx="18" fill="#FFF4D9"/>
  <text x="1190" y="638" class="b" text-anchor="middle">hot_reload</text>
  <rect x="1030" y="680" width="320" height="60" rx="18" fill="#FFF4D9"/>
  <text x="1190" y="718" class="b" text-anchor="middle">get_rebuild_snapshot</text>

  <!-- Bottom note -->
  <rect x="80" y="830" width="1320" height="100" rx="24" fill="#FFFFFF" stroke="#D6DFF8" stroke-width="2"/>
  <text x="130" y="872" class="tag">元素匹配方式</text>
  <text x="130" y="908" class="b">Key（最稳定） / 文本内容 / Widget 类型</text>
  <text x="700" y="908" class="small">这些能力组合起来，覆盖"观察 → 操作 → 诊断"的完整运行时协作链路</text>
</svg>
