<svg width="1500" height="980" viewBox="0 0 1500 980" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6F9FF"/>
      <stop offset="100%" stop-color="#E9EFFF"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F7FF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7B8DFF"/><stop offset="100%" stop-color="#4057D6"/>
    </linearGradient>
    <linearGradient id="indigo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8EA7FF"/><stop offset="100%" stop-color="#5B73E0"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6EE7FF"/><stop offset="100%" stop-color="#3EA8FF"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD180"/><stop offset="100%" stop-color="#F0A03D"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B49AFF"/><stop offset="100%" stop-color="#7A5EE8"/>
    </linearGradient>
    <linearGradient id="vmsBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5B73E0"/>
      <stop offset="100%" stop-color="#4057D6"/>
    </linearGradient>
    <linearGradient id="appBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E6F6FF"/>
      <stop offset="100%" stop-color="#D8EFFF"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="4" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.14"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowR" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4C63E8"/>
    </marker>
    <marker id="arrowR2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7A5EE8"/>
    </marker>
    <style>
      .tag { font: 700 13px 'SF Mono',Menlo,monospace; fill: #4C63E8; letter-spacing: 3px; }
      .title { font: 800 38px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif; fill: #151E3F; letter-spacing: 0.5px; }
      .subtitle { font: 500 18px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif; fill: #5D6B8A; }
      .layerTag { font: 700 11px 'SF Mono',Menlo,monospace; fill: #FFFFFF; letter-spacing: 2px; }
      .quoteTag { font: 700 12px 'SF Mono',Menlo,monospace; fill: #4C63E8; letter-spacing: 2px; }
      .h { font: 800 26px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif; fill: #151E3F; }
      .hSub { font: 500 16px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif; fill: #3A466B; }
      .colTitle { font: 800 14px 'SF Mono',Menlo,monospace; letter-spacing: 3px; }
      .clientName { font: 700 16px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif; fill: #1A234A; }
      .clientHint { font: 500 12px 'SF Mono',Menlo,monospace; fill: #7383A8; }
      .vmsLabel { font: 800 28px 'SF Mono',Menlo,monospace; fill: #FFFFFF; letter-spacing: 3px; }
      .vmsSub { font: 600 13px 'SF Mono',Menlo,monospace; fill: rgba(255,255,255,0.85); letter-spacing: 2px; }
      .capChip { font: 700 13px 'SF Mono',Menlo,monospace; fill: #FFFFFF; letter-spacing: 0.5px; }
      .appLabel { font: 800 22px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif; fill: #1A234A; }
      .extName { font: 600 13px 'SF Mono',Menlo,monospace; fill: #4C63E8; letter-spacing: 0.3px; }
      .extHint { font: 500 11px 'SF Mono',Menlo,monospace; fill: #7383A8; }
      .footH { font: 800 18px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif; fill: #1A234A; }
      .footB { font: 500 14px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif; fill: #3A466B; }
    </style>
  </defs>

  <rect width="1500" height="980" rx="28" fill="url(#bg)"/>

  <!-- header -->
  <text x="80" y="80" class="tag">RUNTIME · WHAT IS VM SERVICE</text>
  <text x="80" y="130" class="title">VM Service 是 Flutter App 对外的"官方调试通道"</text>
  <text x="80" y="165" class="subtitle">DevTools · 热重载 · IDE 调试器 · Flutter Copilot 都共用同一个入口</text>
  <rect x="80" y="180" width="72" height="4" rx="2" fill="url(#accent)"/>

  <!-- ============ Top concept ribbon ============ -->
  <g filter="url(#softShadow)">
    <rect x="80" y="220" width="1340" height="110" rx="22" fill="url(#card)" stroke="#B8C6F5" stroke-width="1.5"/>
  </g>
  <rect x="80" y="220" width="6" height="110" rx="3" fill="url(#accent)"/>
  <text x="110" y="252" class="quoteTag">ANALOGY · 一句话理解</text>
  <text x="110" y="288" class="h">Dart VM 在 Debug / Profile 模式下默认开的官方 RPC 入口</text>
  <text x="110" y="316" class="hSub">不走野路子(抓屏 + OCR / Accessibility / 自起 socket),稳定性继承自 Flutter 工具链本身</text>

  <!-- ============ Main diagram: consumers → VM Service → Flutter App ============ -->

  <!-- Column titles -->
  <text x="220" y="376" class="colTitle" style="fill:#4C63E8" text-anchor="middle">▸ EXTERNAL CONSUMERS  ·  外部进程</text>
  <text x="750" y="376" class="colTitle" style="fill:#4057D6" text-anchor="middle">▸ VM SERVICE  ·  官方通信入口</text>
  <text x="1280" y="376" class="colTitle" style="fill:#3EA8FF" text-anchor="middle">▸ FLUTTER APP  ·  运行时</text>

  <!-- Left column: 4 consumers -->
  <g transform="translate(100, 400)">
    <g filter="url(#softShadow)">
      <rect x="0" y="0" width="240" height="62" rx="14" fill="url(#card)" stroke="#B8C6F5" stroke-width="1.5"/>
    </g>
    <rect x="0" y="0" width="6" height="62" rx="3" fill="url(#accent)"/>
    <circle cx="32" cy="31" r="14" fill="#EEF3FF"/>
    <text x="32" y="36" style="font: 800 12px 'SF Mono'; fill:#4C63E8" text-anchor="middle">DT</text>
    <text x="56" y="28" class="clientName">DevTools</text>
    <text x="56" y="48" class="clientHint">性能 / Inspector / 调试</text>
  </g>
  <g transform="translate(100, 472)">
    <g filter="url(#softShadow)">
      <rect x="0" y="0" width="240" height="62" rx="14" fill="url(#card)" stroke="#B8C6F5" stroke-width="1.5"/>
    </g>
    <rect x="0" y="0" width="6" height="62" rx="3" fill="url(#accent)"/>
    <circle cx="32" cy="31" r="14" fill="#EEF3FF"/>
    <text x="32" y="36" style="font: 800 12px 'SF Mono'; fill:#4C63E8" text-anchor="middle">HR</text>
    <text x="56" y="28" class="clientName">Hot Reload</text>
    <text x="56" y="48" class="clientHint">flutter CLI / IDE 触发</text>
  </g>
  <g transform="translate(100, 544)">
    <g filter="url(#softShadow)">
      <rect x="0" y="0" width="240" height="62" rx="14" fill="url(#card)" stroke="#B8C6F5" stroke-width="1.5"/>
    </g>
    <rect x="0" y="0" width="6" height="62" rx="3" fill="url(#accent)"/>
    <circle cx="32" cy="31" r="14" fill="#EEF3FF"/>
    <text x="32" y="36" style="font: 800 12px 'SF Mono'; fill:#4C63E8" text-anchor="middle">DB</text>
    <text x="56" y="28" class="clientName">IDE Debugger</text>
    <text x="56" y="48" class="clientHint">VS Code · Android Studio</text>
  </g>
  <g transform="translate(100, 616)">
    <g filter="url(#softShadow)">
      <rect x="0" y="0" width="240" height="62" rx="14" fill="url(#card)" stroke="#9FE0F0" stroke-width="2"/>
    </g>
    <rect x="0" y="0" width="6" height="62" rx="3" fill="url(#cyan)"/>
    <circle cx="32" cy="31" r="14" fill="#E6F6FF"/>
    <text x="32" y="36" style="font: 800 12px 'SF Mono'; fill:#2E7FAC" text-anchor="middle">FC</text>
    <text x="56" y="28" class="clientName">flutter_copilot_mcp</text>
    <text x="56" y="48" class="clientHint" style="fill:#2E7FAC">⭐ 本项目走的是它</text>
  </g>

  <!-- Center: VM Service big box -->
  <g filter="url(#softShadow)">
    <rect x="560" y="400" width="380" height="278" rx="22" fill="url(#vmsBg)"/>
  </g>
  <rect x="560" y="400" width="380" height="48" rx="22" fill="rgba(255,255,255,0.12)"/>
  <text x="750" y="430" class="vmsSub" text-anchor="middle">DART VM  ·  OFFICIAL DEBUG API</text>

  <text x="750" y="498" class="vmsLabel" text-anchor="middle">VM Service</text>
  <text x="750" y="524" class="vmsSub" text-anchor="middle" style="font-weight:500">JSON-RPC over WebSocket</text>

  <!-- Capability chips inside VM Service -->
  <g transform="translate(580, 552)">
    <rect x="0" y="0" width="160" height="32" rx="16" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.6)" stroke-width="1"/>
    <text x="80" y="21" class="capChip" text-anchor="middle">读 isolate / 状态</text>
  </g>
  <g transform="translate(750, 552)">
    <rect x="0" y="0" width="170" height="32" rx="16" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.6)" stroke-width="1"/>
    <text x="85" y="21" class="capChip" text-anchor="middle">触发 Hot Reload</text>
  </g>

  <g transform="translate(620, 596)">
    <rect x="0" y="0" width="260" height="36" rx="18" fill="#FFFFFF" stroke="rgba(255,255,255,0.9)" stroke-width="1.5"/>
    <text x="130" y="22" style="font: 800 13px 'SF Mono'; fill:#5B3FD6; letter-spacing:1px" text-anchor="middle">⭐ 调用 Service Extension</text>
  </g>
  <text x="750" y="652" class="vmsSub" text-anchor="middle" style="font-weight:500; font-size:11px; opacity:0.85">App 启动时 registerExtension() 注册的扩展点</text>

  <!-- Right column: Flutter App box with Service Extensions inside -->
  <g filter="url(#softShadow)">
    <rect x="1140" y="400" width="280" height="278" rx="22" fill="url(#appBg)" stroke="#3EA8FF" stroke-width="2"/>
  </g>
  <rect x="1140" y="400" width="280" height="6" fill="url(#cyan)"/>
  <rect x="1164" y="424" width="80" height="22" rx="11" fill="url(#cyan)"/>
  <text x="1204" y="439" class="layerTag" text-anchor="middle">RUNNING APP</text>
  <text x="1280" y="478" class="appLabel" text-anchor="middle">Flutter App</text>
  <text x="1280" y="500" class="clientHint" text-anchor="middle">Dart Isolate · Widget Tree</text>

  <!-- Service Extensions list -->
  <g transform="translate(1160, 520)">
    <text x="0" y="0" style="font: 700 11px 'SF Mono'; fill:#5B3FD6; letter-spacing:1.5px">REGISTERED SERVICE EXTENSIONS</text>
    <g transform="translate(0, 14)">
      <rect x="0" y="0" width="240" height="26" rx="6" fill="#FFFFFF" stroke="#B49AFF" stroke-width="1"/>
      <text x="10" y="17" class="extName">ext.flutter.copilot.tap</text>
    </g>
    <g transform="translate(0, 44)">
      <rect x="0" y="0" width="240" height="26" rx="6" fill="#FFFFFF" stroke="#B49AFF" stroke-width="1"/>
      <text x="10" y="17" class="extName">ext.flutter.copilot.screenshot</text>
    </g>
    <g transform="translate(0, 74)">
      <rect x="0" y="0" width="240" height="26" rx="6" fill="#FFFFFF" stroke="#B49AFF" stroke-width="1"/>
      <text x="10" y="17" class="extName">ext.flutter.copilot.get_logs</text>
    </g>
    <g transform="translate(0, 104)">
      <rect x="0" y="0" width="240" height="26" rx="6" fill="#FFFFFF" stroke="#B8C6F5" stroke-width="1" stroke-dasharray="4 3"/>
      <text x="10" y="17" class="extHint">… 由 flutter_copilot_claw 注册</text>
    </g>
  </g>

  <!-- Connection lines: each consumer → VM Service, VM Service → App -->
  <g stroke="#4C63E8" stroke-width="2" fill="none" opacity="0.55">
    <path d="M 340 431 L 560 480" stroke-linecap="round" marker-end="url(#arrowR)"/>
    <path d="M 340 503 L 560 510" stroke-linecap="round" marker-end="url(#arrowR)"/>
    <path d="M 340 575 L 560 540" stroke-linecap="round" marker-end="url(#arrowR)"/>
  </g>
  <!-- Highlighted line for flutter_copilot_mcp (thicker, accent color) -->
  <g stroke="#2E7FAC" stroke-width="3" fill="none" opacity="0.85">
    <path d="M 340 647 L 560 575" stroke-linecap="round" marker-end="url(#arrowR)"/>
  </g>

  <!-- Right side: VM Service → App, emphasize Service Extension -->
  <g stroke="#7A5EE8" stroke-width="3" fill="none" opacity="0.85">
    <path d="M 940 539 L 1140 539" stroke-linecap="round" marker-end="url(#arrowR2)"/>
  </g>
  <g transform="translate(975, 514)" filter="url(#softShadow)">
    <rect x="0" y="0" width="130" height="22" rx="11" fill="#FFFFFF" stroke="#7A5EE8" stroke-width="1.5"/>
    <text x="65" y="15" style="font: 700 11px 'SF Mono'; fill:#5B3FD6; letter-spacing:1.5px" text-anchor="middle">callExtension</text>
  </g>

  <!-- ============ Bottom: 2 capability cards + value summary ============ -->
  <g filter="url(#softShadow)">
    <rect x="80" y="720" width="1340" height="200" rx="22" fill="#FFFFFF" stroke="#E5EBFF" stroke-width="1.5"/>
  </g>
  <rect x="80" y="720" width="6" height="200" rx="3" fill="url(#amber)"/>
  <text x="115" y="752" class="quoteTag" style="fill:#F0802D; letter-spacing:2px">VM SERVICE OFFERS TWO KINDS OF CAPABILITIES</text>
  <text x="115" y="784" class="footH">两类核心能力,加上自定义 Service Extension —— Copilot 的全部干预手段</text>

  <!-- 2 cap cards + 1 highlight -->
  <g transform="translate(115, 808)">
    <!-- Observe -->
    <g>
      <rect x="0" y="0" width="400" height="92" rx="14" fill="#EEF3FF" stroke="#7B8DFF" stroke-width="1.5"/>
      <rect x="14" y="14" width="64" height="22" rx="11" fill="url(#accent)"/>
      <text x="46" y="29" class="layerTag" text-anchor="middle">OBSERVE</text>
      <text x="14" y="60" class="footH" style="font-size:16px">观察类 · 读取运行时状态</text>
      <text x="14" y="80" class="footB" style="font-size:13px">isolate 状态 / Widget 树 / 性能数据 / 日志</text>
    </g>
    <!-- Intervene -->
    <g transform="translate(420, 0)">
      <rect x="0" y="0" width="400" height="92" rx="14" fill="#EEF3FF" stroke="#7B8DFF" stroke-width="1.5"/>
      <rect x="14" y="14" width="76" height="22" rx="11" fill="url(#accent)"/>
      <text x="52" y="29" class="layerTag" text-anchor="middle">INTERVENE</text>
      <text x="14" y="60" class="footH" style="font-size:16px">干预类 · 改变运行时行为</text>
      <text x="14" y="80" class="footB" style="font-size:13px">触发热重载 / 调用 Service Extension</text>
    </g>
    <!-- Service Extension highlight -->
    <g transform="translate(840, 0)">
      <rect x="0" y="0" width="370" height="92" rx="14" fill="#F2EEFF" stroke="#7A5EE8" stroke-width="2"/>
      <rect x="14" y="14" width="120" height="22" rx="11" fill="url(#violet)"/>
      <text x="74" y="29" class="layerTag" text-anchor="middle">SERVICE EXTENSION</text>
      <text x="14" y="60" class="footH" style="font-size:16px; fill:#5B3FD6">⭐ Copilot 的关键齿轮</text>
      <text x="14" y="80" class="footB" style="font-size:13px">claw 注册扩展 → MCP 像调 RPC 一样调用</text>
    </g>
  </g>
</svg>
