name: flutter_copilot_mcp
description: MCP server for AI agents to inspect and control running Flutter apps through VM Service and Flutter Copilot. #mcp #ai #copilot #flutter_copilot.
version: 1.0.5
repository: https://github.com/dust365/flutter_copilot
topics:
  - flutter
  - mcp
  - ai
  - flutter-copilot
  - copilot
resolution: workspace

executables:
  flutter_copilot_mcp: flutter_copilot_mcp

environment:
  sdk: ^3.6.0

dependencies:
  args: ^2.7.0
  logging: ^1.3.0
  mcp_dart: ^1.2.1
  vm_service: ^14.3.1

dev_dependencies:
  lints: ^3.0.0
  test: ^1.25.0
