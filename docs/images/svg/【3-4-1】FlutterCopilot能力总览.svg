<svg width="1500" height="980" viewBox="0 0 1500 980" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6F9FF"/>
      <stop offset="100%" stop-color="#E9EFFF"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F7FF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7B8DFF"/><stop offset="100%" stop-color="#4057D6"/>
    </linearGradient>
    <linearGradient id="gConnect" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8EA7FF"/><stop offset="100%" stop-color="#5B73E0"/>
    </linearGradient>
    <linearGradient id="gObserve" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6EE7FF"/><stop offset="100%" stop-color="#3EA8FF"/>
    </linearGradient>
    <linearGradient id="gNavigate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A8B4FF"/><stop offset="100%" stop-color="#6B7FE8"/>
    </linearGradient>
    <linearGradient id="gInteract" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB86B"/><stop offset="100%" stop-color="#F0802D"/>
    </linearGradient>
    <linearGradient id="gDiagnose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF92B8"/><stop offset="100%" stop-color="#E25D8F"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="5" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.14"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .tag { font: 700 13px 'SF Mono',Menlo,monospace; fill: #4C63E8; letter-spacing: 3px; }
      .title { font: 800 40px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif; fill: #151E3F; letter-spacing: 1px; }
      .subtitle { font: 500 18px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif; fill: #5D6B8A; }
      .catLabel { font: 700 11px 'SF Mono',Menlo,monospace; fill: #FFFFFF; letter-spacing: 2px; }
      .catName { font: 700 22px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif; fill: #1A234A; }
      .catCount { font: 800 42px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
      .catUnit { font: 500 14px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif; fill: #7383A8; }
      .catDesc { font: 500 14px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif; fill: #5D6B8A; }
      .tool { font: 600 14px 'SF Mono','JetBrains Mono',Menlo,monospace; fill: #1A234A; letter-spacing: 0.3px; }
      .toolSub { font: 500 11px 'SF Mono',Menlo,monospace; fill: #7383A8; }
      .totalTag { font: 700 11px 'SF Mono',Menlo,monospace; fill: #FFFFFF; letter-spacing: 3px; }
      .totalNum { font: 900 72px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill: #FFFFFF; letter-spacing: 2px; }
      .totalUnit { font: 500 15px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif; fill: #C8D4F5; letter-spacing: 1px; }
      .footNote { font: 500 15px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif; fill: #5D6B8A; }
      .footH { font: 700 16px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif; fill: #1A234A; }
      .chainTag { font: 700 12px 'SF Mono',Menlo,monospace; fill: #4C63E8; letter-spacing: 2px; }
    </style>
  </defs>

  <rect width="1500" height="980" rx="28" fill="url(#bg)"/>

  <!-- header -->
  <text x="80" y="80" class="tag">CAPABILITY · 15 MCP TOOLS</text>
  <text x="80" y="130" class="title">Flutter Copilot 能力总览</text>
  <text x="80" y="165" class="subtitle">15 个 MCP 工具，覆盖 连接 · 观察 · 交互 · 导航 · 诊断 五类能力</text>
  <rect x="80" y="180" width="72" height="4" rx="2" fill="url(#accent)"/>

  <!-- Big total badge (top-right) -->
  <g filter="url(#softShadow)">
    <rect x="1220" y="60" width="220" height="130" rx="22" fill="url(#accent)"/>
  </g>
  <text x="1330" y="100" class="totalTag" text-anchor="middle">TOTAL TOOLS</text>
  <text x="1330" y="160" class="totalNum" text-anchor="middle">15</text>
  <text x="1330" y="182" class="totalUnit" text-anchor="middle">MCP capabilities</text>

  <!-- Capability chain indicator -->
  <g transform="translate(80, 220)">
    <text class="chainTag">OBSERVE → ACT → DIAGNOSE</text>
  </g>

  <!-- Row 1 -->
  <!-- Connect -->
  <g filter="url(#softShadow)">
    <rect x="80" y="250" width="300" height="230" rx="22" fill="url(#card)" stroke="#B8C6F5" stroke-width="1.5"/>
  </g>
  <rect x="80" y="250" width="300" height="6" fill="url(#gConnect)"/>
  <rect x="102" y="278" width="82" height="22" rx="11" fill="url(#gConnect)"/>
  <text x="143" y="293" class="catLabel" text-anchor="middle">CONNECT</text>
  <text x="102" y="335" class="catName">连接管理</text>
  <text x="102" y="378" class="catCount" style="fill:#4C63E8">2</text>
  <text x="140" y="378" class="catUnit">tools</text>
  <line x1="102" y1="395" x2="358" y2="395" stroke="#E5EBFF" stroke-width="1.5"/>
  <text x="102" y="423" class="tool">connect</text>
  <text x="102" y="450" class="tool">disconnect</text>

  <!-- Observe (wider to fit long tool name) -->
  <g filter="url(#softShadow)">
    <rect x="400" y="250" width="340" height="230" rx="22" fill="url(#card)" stroke="#B8C6F5" stroke-width="1.5"/>
  </g>
  <rect x="400" y="250" width="340" height="6" fill="url(#gObserve)"/>
  <rect x="422" y="278" width="82" height="22" rx="11" fill="url(#gObserve)"/>
  <text x="463" y="293" class="catLabel" text-anchor="middle">OBSERVE</text>
  <text x="422" y="335" class="catName">观察能力</text>
  <text x="422" y="378" class="catCount" style="fill:#3EA8FF">3</text>
  <text x="460" y="378" class="catUnit">tools</text>
  <line x1="422" y1="395" x2="718" y2="395" stroke="#E5EBFF" stroke-width="1.5"/>
  <text x="422" y="423" class="tool">get_interactive_elements</text>
  <text x="422" y="450" class="tool">take_screenshots  ·  get_logs</text>

  <!-- Navigate -->
  <g filter="url(#softShadow)">
    <rect x="760" y="250" width="320" height="230" rx="22" fill="url(#card)" stroke="#B8C6F5" stroke-width="1.5"/>
  </g>
  <rect x="760" y="250" width="320" height="6" fill="url(#gNavigate)"/>
  <rect x="782" y="278" width="90" height="22" rx="11" fill="url(#gNavigate)"/>
  <text x="827" y="293" class="catLabel" text-anchor="middle">NAVIGATE</text>
  <text x="782" y="335" class="catName">导航能力</text>
  <text x="782" y="378" class="catCount" style="fill:#6B7FE8">1</text>
  <text x="820" y="378" class="catUnit">tool · 5 operations</text>
  <line x1="782" y1="395" x2="1058" y2="395" stroke="#E5EBFF" stroke-width="1.5"/>
  <text x="782" y="423" class="tool">navigate</text>
  <text x="782" y="453" class="toolSub">push · pop · replace · pushNamed · popUntil</text>

  <!-- Diagnose -->
  <g filter="url(#softShadow)">
    <rect x="1100" y="250" width="320" height="230" rx="22" fill="url(#card)" stroke="#B8C6F5" stroke-width="1.5"/>
  </g>
  <rect x="1100" y="250" width="320" height="6" fill="url(#gDiagnose)"/>
  <rect x="1122" y="278" width="90" height="22" rx="11" fill="url(#gDiagnose)"/>
  <text x="1167" y="293" class="catLabel" text-anchor="middle">DIAGNOSE</text>
  <text x="1122" y="335" class="catName">诊断能力</text>
  <text x="1122" y="378" class="catCount" style="fill:#E25D8F">2</text>
  <text x="1160" y="378" class="catUnit">tools</text>
  <line x1="1122" y1="395" x2="1398" y2="395" stroke="#E5EBFF" stroke-width="1.5"/>
  <text x="1122" y="423" class="tool">hot_reload</text>
  <text x="1122" y="450" class="tool">get_rebuild_snapshot</text>

  <!-- Row 2: Interact (big card spanning most width) -->
  <g filter="url(#softShadow)">
    <rect x="80" y="510" width="1340" height="270" rx="22" fill="url(#card)" stroke="#F0A560" stroke-width="1.5"/>
  </g>
  <rect x="80" y="510" width="1340" height="6" fill="url(#gInteract)"/>
  <rect x="102" y="538" width="90" height="22" rx="11" fill="url(#gInteract)"/>
  <text x="147" y="553" class="catLabel" text-anchor="middle">INTERACT</text>
  <text x="102" y="596" class="catName">交互能力</text>
  <text x="102" y="638" class="catCount" style="fill:#F0802D">7</text>
  <text x="140" y="638" class="catUnit">tools — 覆盖主流手势与输入</text>
  <text x="102" y="666" class="catDesc">通过 Key · 文本内容 · Widget 类型匹配元素</text>

  <!-- 7 tool pills -->
  <g transform="translate(102, 700)">
    <g>
      <rect x="0" y="0" width="170" height="52" rx="12" fill="#FFF3E0" stroke="#F0A560" stroke-width="1.5"/>
      <circle cx="22" cy="26" r="6" fill="#F0802D"/>
      <text x="38" y="31" class="tool">tap</text>
    </g>
    <g transform="translate(185, 0)">
      <rect x="0" y="0" width="170" height="52" rx="12" fill="#FFF3E0" stroke="#F0A560" stroke-width="1.5"/>
      <circle cx="22" cy="26" r="6" fill="#F0802D"/>
      <text x="38" y="31" class="tool">long_press</text>
    </g>
    <g transform="translate(370, 0)">
      <rect x="0" y="0" width="170" height="52" rx="12" fill="#FFF3E0" stroke="#F0A560" stroke-width="1.5"/>
      <circle cx="22" cy="26" r="6" fill="#F0802D"/>
      <text x="38" y="31" class="tool">double_tap</text>
    </g>
    <g transform="translate(555, 0)">
      <rect x="0" y="0" width="170" height="52" rx="12" fill="#FFF3E0" stroke="#F0A560" stroke-width="1.5"/>
      <circle cx="22" cy="26" r="6" fill="#F0802D"/>
      <text x="38" y="31" class="tool">enter_text</text>
    </g>
    <g transform="translate(740, 0)">
      <rect x="0" y="0" width="170" height="52" rx="12" fill="#FFF3E0" stroke="#F0A560" stroke-width="1.5"/>
      <circle cx="22" cy="26" r="6" fill="#F0802D"/>
      <text x="38" y="31" class="tool">scroll_to</text>
    </g>
    <g transform="translate(925, 0)">
      <rect x="0" y="0" width="170" height="52" rx="12" fill="#FFF3E0" stroke="#F0A560" stroke-width="1.5"/>
      <circle cx="22" cy="26" r="6" fill="#F0802D"/>
      <text x="38" y="31" class="tool">drag</text>
    </g>
    <g transform="translate(1110, 0)">
      <rect x="0" y="0" width="170" height="52" rx="12" fill="#FFF3E0" stroke="#F0A560" stroke-width="1.5"/>
      <circle cx="22" cy="26" r="6" fill="#F0802D"/>
      <text x="38" y="31" class="tool">swipe</text>
    </g>
  </g>

  <!-- Bottom note -->
  <g filter="url(#softShadow)">
    <rect x="80" y="810" width="1340" height="120" rx="22" fill="#FFFFFF" stroke="#E5EBFF" stroke-width="1.5"/>
  </g>
  <rect x="80" y="810" width="6" height="120" rx="3" fill="url(#accent)"/>
  <text x="115" y="848" class="chainTag">ELEMENT MATCHING</text>
  <text x="115" y="880" class="footH">元素匹配方式：Key（最稳定） · 文本内容 · Widget 类型</text>
  <text x="115" y="908" class="footNote">这些能力组合起来，覆盖"观察 → 操作 → 诊断"的完整运行时协作链路。</text>

  <!-- chain icons on the right of bottom note -->
  <g transform="translate(1100, 860)">
    <circle cx="0" cy="0" r="20" fill="url(#gObserve)"/>
    <text y="5" class="totalTag" style="font-size:10px" text-anchor="middle">OBS</text>
    <path d="M25 0 L55 0" stroke="#4C63E8" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="80" cy="0" r="20" fill="url(#gInteract)"/>
    <text x="80" y="5" class="totalTag" style="font-size:10px" text-anchor="middle">ACT</text>
    <path d="M105 0 L135 0" stroke="#4C63E8" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="160" cy="0" r="20" fill="url(#gDiagnose)"/>
    <text x="160" y="5" class="totalTag" style="font-size:10px" text-anchor="middle">DIA</text>
  </g>
</svg>
