name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']

jobs:
  analyze:
    name: Analyze and Check
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies for tool
        run: |
          cd tool
          dart pub get

      - name: Install dependencies for flutter_copilot_mcp
        run: |
          cd packages/flutter_copilot_mcp
          dart pub get

      - name: Install dependencies for flutter_copilot_claw
        run: |
          cd packages/flutter_copilot_claw
          flutter pub get

      - name: Check version.g.dart is in sync
        run: |
          dart tool/version.dart
          if ! git diff --exit-code packages/flutter_copilot_mcp/lib/src/version.g.dart; then
            echo "ERROR: version.g.dart is out of sync. Please run 'dart tool/version.dart' and commit the changes."
            exit 1
          fi

      - name: Analyze flutter_copilot_mcp
        run: |
          cd packages/flutter_copilot_mcp
          dart analyze --fatal-infos lib bin

      - name: Analyze flutter_copilot_claw
        run: |
          cd packages/flutter_copilot_claw
          flutter analyze --fatal-infos lib

      - name: Check formatting for flutter_copilot_mcp
        run: |
          cd packages/flutter_copilot_mcp
          dart format --set-exit-if-changed lib bin

      - name: Check formatting for flutter_copilot_claw
        run: |
          cd packages/flutter_copilot_claw
          dart format --set-exit-if-changed lib

      - name: Check formatting for tool
        run: |
          cd tool
          dart format --set-exit-if-changed .
