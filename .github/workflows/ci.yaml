name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']

jobs:
  analyze:
    name: Analyze and Check
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true

      - name: Install dependencies for tool
        run: |
          cd tool
          dart pub get

      - name: Install dependencies for flutter_copilot_mcp
        run: |
          cd packages/flutter_copilot_mcp
          dart pub get

      - name: Install dependencies for flutter_copilot_claw
        run: |
          cd packages/flutter_copilot_claw
          flutter pub get

      - name: Check Dart formatting
        run: |
          if ! dart format --output=none --set-exit-if-changed \
            packages/flutter_copilot_mcp/lib packages/flutter_copilot_mcp/bin \
            packages/flutter_copilot_claw/lib tool; then
            echo "::error::Dart formatting is out of sync. Run: dart format packages/flutter_copilot_mcp/lib packages/flutter_copilot_mcp/bin packages/flutter_copilot_claw/lib tool"
            exit 1
          fi

      - name: Check generated version files are in sync
        run: dart tool/version.dart --check

      - name: Analyze flutter_copilot_mcp
        run: |
          cd packages/flutter_copilot_mcp
          dart analyze --fatal-infos lib bin

      - name: Analyze flutter_copilot_claw
        run: |
          cd packages/flutter_copilot_claw
          flutter analyze --fatal-infos lib
